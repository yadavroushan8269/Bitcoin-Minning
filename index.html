<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NSG Aviator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<header>
  <div class="logo">✈ <b>NSG</b><small>AVIATOR</small></div>
  <div class="top-right">
    <div class="balance">🪙 <span id="balance">50.00</span></div>
    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>
</header>

<div class="recent" id="recent"></div>

<main>

  <div class="game-head">
    <b>AVIATOR</b>
    <span id="round">Round #001</span>
  </div>

  <div class="chart">

    <div class="multiplier" id="multiplier">1.00x</div>

    <div class="grid-lines"></div>

    <svg viewBox="0 0 600 330" preserveAspectRatio="none">
      <defs>
        <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e90038" stop-opacity=".55"/>
          <stop offset="1" stop-color="#e90038" stop-opacity=".03"/>
        </linearGradient>
      </defs>

      <path id="areaPath"
        fill="url(#area)"
        d="M0 320 L0 320"/>

      <path id="linePath"
        fill="none"
        stroke="#ff003c"
        stroke-width="5"
        d="M0 320"/>

      <text id="plane" x="25" y="305">✈</text>
    </svg>

    <div class="status" id="status">WAITING FOR NEXT ROUND</div>
  </div>

  <div class="bets">

    <div class="bet-box">
      <div class="tabs">
        <button class="selected">Bet</button>
        <button>Auto</button>
      </div>

      <div class="bet-row">
        <div>
          <div class="amount">
            <button onclick="changeBet(0,-1)">−</button>
            <span id="bet0">10</span>
            <button onclick="changeBet(0,1)">+</button>
          </div>

          <div class="presets">
            <button onclick="setBet(0,1)">1</button>
            <button onclick="setBet(0,5)">5</button>
            <button onclick="setBet(0,10)">10</button>
            <button onclick="setBet(0,25)">25</button>
          </div>
        </div>

        <button class="bet-button" id="betBtn0" onclick="placeBet(0)">
          BET
        </button>
      </div>
    </div>


    <div class="bet-box">
      <div class="tabs">
        <button class="selected">Bet</button>
        <button>Auto</button>
      </div>

      <div class="bet-row">
        <div>
          <div class="amount">
            <button onclick="changeBet(1,-1)">−</button>
            <span id="bet1">10</span>
            <button onclick="changeBet(1,1)">+</button>
          </div>

          <div class="presets">
            <button onclick="setBet(1,1)">1</button>
            <button onclick="setBet(1,5)">5</button>
            <button onclick="setBet(1,10)">10</button>
            <button onclick="setBet(1,25)">25</button>
          </div>
        </div>

        <button class="bet-button" id="betBtn1" onclick="placeBet(1)">
          BET
        </button>
      </div>
    </div>

  </div>

  <div class="history-tabs">
    <button class="active">All Bets</button>
    <button>My Bets</button>
  </div>

  <div class="history">
    <div class="history-head">
      <span>User</span>
      <span>Bet</span>
      <span>Mult.</span>
      <span>Result</span>
    </div>

    <div id="historyList"></div>
  </div>

</main>

<nav>
  <button class="active">⌂<small>Game</small></button>
  <button onclick="showHistory()">◷<small>History</small></button>
  <button onclick="openMenu()">☰<small>Menu</small></button>
</nav>


<!-- SIDE MENU -->

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<aside id="sideMenu">

  <div class="profile">
    <div class="avatar">N</div>
    <div>
      <b>Player <span id="playerId"></span></b>
      <small>NSG Aviator</small>
    </div>
  </div>

  <div class="menu-item">
    🔊 <span>Sound</span>
    <label class="switch">
      <input type="checkbox" checked>
      <i></i>
    </label>
  </div>

  <div class="menu-item">
    🎵 <span>Music</span>
    <label class="switch">
      <input type="checkbox">
      <i></i>
    </label>
  </div>

  <div class="menu-item">
    ✨ <span>Animation</span>
    <label class="switch">
      <input type="checkbox" checked>
      <i></i>
    </label>
  </div>

  <button class="link-item" onclick="showHistory()">◉ Game History</button>
  <button class="link-item" onclick="resetCoins()">↻ Reset Virtual Coins</button>
  <button class="link-item" onclick="showRules()">ⓘ Game Rules</button>

  <div class="menu-note">
    Virtual coins only.<br>
    No real-money betting or withdrawals.
  </div>

</aside>

</div>

<script src="script.js"></script>
</body>
</html>
