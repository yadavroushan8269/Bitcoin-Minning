<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - Bitcoin Mining</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #0d4b32 0%, #062719 35%, #020b07 75%);
      color: #f5f5f5;
      font-family: Georgia, "Times New Roman", serif;
      padding: 35px 15px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #08783d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 65px;
      font-weight: bold;
      box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }

    .brand h1 {
      font-size: 42px;
      margin-top: 20px;
    }

    .brand p {
      color: #aebdb5;
      font-size: 24px;
      margin-top: 8px;
    }

    .card {
      background: rgba(6, 27, 18, .88);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      margin-bottom: 22px;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #b7c4be;
      font-size: 20px;
      margin: 18px 0 9px;
    }

    input {
      width: 100%;
      height: 64px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.13);
      background: #06150f;
      color: white;
      padding: 0 20px;
      font-size: 20px;
      outline: none;
    }

    input:focus {
      border-color: #13a85c;
    }

    button {
      width: 100%;
      min-height: 62px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #14a95e, #087b42);
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button:active {
      transform: scale(.99);
    }

    .logout {
      background: #263a31;
    }

    .message {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.5;
      color: #ffb3b3;
      word-break: break-word;
    }

    .success {
      color: #73e5a7;
    }

    .hidden {
      display: none !important;
    }

    .user-box {
      margin-top: 25px;
      padding: 24px;
      border-radius: 22px;
      background: #071c12;
      border: 1px solid rgba(255,255,255,.1);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 18px;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row span:first-child {
      color: #9eafa7;
    }

    .balance {
      font-size: 36px;
      color: #61e39a;
      font-weight: bold;
    }

    .actions {
      margin-top: 20px;
    }

    .small-note {
      color: #8fa198;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 12px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 24px;
      }

      .logo {
        width: 90px;
        height: 90px;
        font-size: 52px;
      }

      .brand h1 {
        font-size: 34px;
      }

      .brand p {
        font-size: 18px;
      }

      h2 {
        font-size: 27px;
      }

      input {
        height: 58px;
        font-size: 17px;
      }

      button {
        min-height: 58px;
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <div class="logo">₿</div>
      <h1>Admin Panel</h1>
      <p>Bitcoin Mining • Test / Demo Balance</p>
    </div>

    <!-- LOGIN -->
    <section class="card" id="loginCard">

      <h2>Admin Login</h2>

      <label for="adminEmail">Admin Email</label>
      <input
        type="email"
        id="adminEmail"
        value="yadavroushan8269@gmail.com"
        autocomplete="email"
      >

      <label for="adminPassword">Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Enter admin password"
        autocomplete="current-password"
      >

      <button id="loginBtn">
        Login
      </button>

      <p class="message" id="loginMessage"></p>

    </section>


    <!-- ADMIN PANEL -->
    <section class="card hidden" id="adminCard">

      <h2>Manage Test Balance</h2>

      <label for="searchUserId">User ID</label>

      <input
        type="text"
        id="searchUserId"
        placeholder="Example: You-6133548"
      >

      <button id="searchBtn">
        Search User
      </button>

      <p class="message" id="searchMessage"></p>


      <!-- USER DETAILS -->
      <div class="user-box hidden" id="userBox">

        <div class="row">
          <span>User ID</span>
          <strong id="displayUserId">-</strong>
        </div>

        <div class="row">
          <span>Firebase UID</span>
          <strong id="displayUid">-</strong>
        </div>

        <div class="row">
          <span>Current Test Balance</span>
          <strong class="balance" id="displayBalance">₹0</strong>
        </div>


        <div class="actions">

          <label for="balanceAmount">
            Amount
          </label>

          <input
            type="number"
            id="balanceAmount"
            min="0"
            step="1"
            placeholder="Enter amount"
          >


          <button id="setBalanceBtn">
            Set Balance
          </button>

          <button id="addBalanceBtn">
            Add Balance
          </button>

          <button id="removeBalanceBtn">
            Remove Balance
          </button>

          <p class="message" id="balanceMessage"></p>

        </div>

      </div>


      <button class="logout" id="logoutBtn">
        Logout
      </button>

      <p class="small-note">
        This panel is for test/demo balance management only.
        It does not perform real-money transfers or payment processing.
      </p>

    </section>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    /* =========================================================
       FIREBASE CONFIG
       ========================================================= */

    const firebaseConfig = {
      apiKey: "AIzaSYAN5jFZ0hBOb-Zmbrv8W1E2aGqnmd8_iOM",
      authDomain: "bitcoin-minning-web.firebaseapp.com",
      projectId: "bitcoin-minning-web",
      storageBucket: "bitcoin-minning-web.firebasestorage.app",
      messagingSenderId: "691683594489",
      appId: "1:691683594489:web:96252fee18748e54ad9228"
    };


    /* =========================================================
       INITIALIZE FIREBASE
       ========================================================= */

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();


    /* =========================================================
       ADMIN EMAIL
       ========================================================= */

    const ADMIN_EMAIL = "yadavroushan8269@gmail.com";


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loginCard =
      document.getElementById("loginCard");

    const adminCard =
      document.getElementById("adminCard");

    const adminEmail =
      document.getElementById("adminEmail");

    const adminPassword =
      document.getElementById("adminPassword");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const searchUserId =
      document.getElementById("searchUserId");

    const searchBtn =
      document.getElementById("searchBtn");

    const searchMessage =
      document.getElementById("searchMessage");

    const userBox =
      document.getElementById("userBox");

    const displayUserId =
      document.getElementById("displayUserId");

    const displayUid =
      document.getElementById("displayUid");

    const displayBalance =
      document.getElementById("displayBalance");

    const balanceAmount =
      document.getElementById("balanceAmount");

    const setBalanceBtn =
      document.getElementById("setBalanceBtn");

    const addBalanceBtn =
      document.getElementById("addBalanceBtn");

    const removeBalanceBtn =
      document.getElementById("removeBalanceBtn");

    const balanceMessage =
      document.getElementById("balanceMessage");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =========================================================
       CURRENT USER DOCUMENT
       ========================================================= */

    let currentDocRef = null;
    let currentUserData = null;


    /* =========================================================
       LOGIN
       ========================================================= */

    loginBtn.addEventListener("click", async function () {

      const email =
        adminEmail.value.trim();

      const password =
        adminPassword.value;

      loginMessage.textContent = "";
      loginMessage.className = "message";

      if (!email) {
        loginMessage.textContent =
          "Admin email enter karo.";
        return;
      }

      if (!password) {
        loginMessage.textContent =
          "Password enter karo.";
        return;
      }

      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        loginMessage.textContent =
          "Ye email admin email nahi hai.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {

        await auth.signInWithEmailAndPassword(
          email,
          password
        );

        loginMessage.textContent =
          "Login successful.";

        loginMessage.className =
          "message success";

      } catch (error) {

        console.error(error);

        loginMessage.textContent =
          "Firebase: " + getFirebaseError(error);

        loginMessage.className =
          "message";

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

      }

    });


    /* =========================================================
       AUTH STATE
       ========================================================= */

    auth.onAuthStateChanged(function (user) {

      if (!user) {

        loginCard.classList.remove("hidden");
        adminCard.classList.add("hidden");

        return;
      }


      if (
        !user.email ||
        user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
      ) {

        auth.signOut();

        loginMessage.textContent =
          "Access denied. Sirf admin account allowed hai.";

        return;
      }


      loginCard.classList.add("hidden");
      adminCard.classList.remove("hidden");

    });


    /* =========================================================
       SEARCH USER
       ========================================================= */

    searchBtn.addEventListener("click", searchUser);

    searchUserId.addEventListener("keydown", function (event) {

      if (event.key === "Enter") {
        searchUser();
      }

    });


    async function searchUser() {

      const userId =
        searchUserId.value.trim();

      searchMessage.textContent = "";
      searchMessage.className = "message";

      userBox.classList.add("hidden");

      currentDocRef = null;
      currentUserData = null;


      if (!userId) {

        searchMessage.textContent =
          "User ID enter karo.";

        return;
      }


      const user = auth.currentUser;

      if (!user) {

        searchMessage.textContent =
          "Admin login nahi hai.";

        return;
      }


      if (
        !user.email ||
        user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
      ) {

        searchMessage.textContent =
          "Admin permission required.";

        return;
      }


      searchBtn.disabled = true;
      searchBtn.textContent = "Searching...";


      try {

        /*
         * Public User ID field se search.
         *
         * Example:
         * You-6133548
         */

        const snapshot =
          await db
            .collection("testBalances")
            .where("userId", "==", userId)
            .limit(1)
            .get();


        if (snapshot.empty) {

          searchMessage.textContent =
            "User not found: " + userId;

          return;
        }


        const doc =
          snapshot.docs[0];

        currentDocRef = doc.ref;
        currentUserData = doc.data();


        displayUserId.textContent =
          currentUserData.userId || userId;

        displayUid.textContent =
          currentUserData.uid || doc.id;

        displayBalance.textContent =
          formatMoney(currentUserData.balance);


        userBox.classList.remove("hidden");


        searchMessage.textContent =
          "User found.";

        searchMessage.className =
          "message success";


      } catch (error) {

        console.error(error);

        searchMessage.textContent =
          "Firebase: " + getFirebaseError(error);

      } finally {

        searchBtn.disabled = false;
        searchBtn.textContent = "Search User";

      }

    }


    /* =========================================================
       SET BALANCE
       ========================================================= */

    setBalanceBtn.addEventListener(
      "click",
      async function () {

        const amount =
          getAmount();

        if (amount === null) return;

        if (!currentDocRef) {

          showBalanceError(
            "Pehle user search karo."
          );

          return;
        }


        await updateBalance(amount);

      }
    );


    /* =========================================================
       ADD BALANCE
       ========================================================= */

    addBalanceBtn.addEventListener(
      "click",
      async function () {

        const amount =
          getAmount();

        if (amount === null) return;

        if (!currentDocRef) {

          showBalanceError(
            "Pehle user search karo."
          );

          return;
        }


        const oldBalance =
          Number(currentUserData.balance || 0);

        const newBalance =
          oldBalance + amount;


        await updateBalance(newBalance);

      }
    );


    /* =========================================================
       REMOVE BALANCE
       ========================================================= */

    removeBalanceBtn.addEventListener(
      "click",
      async function () {

        const amount =
          getAmount();

        if (amount === null) return;

        if (!currentDocRef) {

          showBalanceError(
            "Pehle user search karo."
          );

          return;
        }


        const oldBalance =
          Number(currentUserData.balance || 0);

        const newBalance =
          Math.max(0, oldBalance - amount);


        await updateBalance(newBalance);

      }
    );


    /* =========================================================
       UPDATE BALANCE
       ========================================================= */

    async function updateBalance(newBalance) {

      if (!currentDocRef) {

        showBalanceError(
          "User document available nahi hai."
        );

        return;
      }


      newBalance =
        Number(newBalance);


      if (!Number.isFinite(newBalance)) {

        showBalanceError(
          "Invalid balance."
        );

        return;
      }


      if (newBalance < 0) {
        newBalance = 0;
      }


      setBalanceBtn.disabled = true;
      addBalanceBtn.disabled = true;
      removeBalanceBtn.disabled = true;


      balanceMessage.textContent =
        "Updating...";

      balanceMessage.className =
        "message";


      try {

        await currentDocRef.update({

          balance: newBalance,

          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()

        });


        currentUserData.balance =
          newBalance;


        displayBalance.textContent =
          formatMoney(newBalance);


        balanceAmount.value = "";


        balanceMessage.textContent =
          "Balance successfully updated: " +
          formatMoney(newBalance);

        balanceMessage.className =
          "message success";


      } catch (error) {

        console.error(error);

        balanceMessage.textContent =
          "Firebase: " + getFirebaseError(error);

        balanceMessage.className =
          "message";

      } finally {

        setBalanceBtn.disabled = false;
        addBalanceBtn.disabled = false;
        removeBalanceBtn.disabled = false;

      }

    }


    /* =========================================================
       GET AMOUNT
       ========================================================= */

    function getAmount() {

      const value =
        balanceAmount.value.trim();

      if (value === "") {

        showBalanceError(
          "Amount enter karo."
        );

        return null;
      }


      const amount =
        Number(value);


      if (!Number.isFinite(amount)) {

        showBalanceError(
          "Valid amount enter karo."
        );

        return null;
      }


      if (amount < 0) {

        showBalanceError(
          "Amount negative nahi ho sakta."
        );

        return null;
      }


      return amount;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    function showBalanceError(message) {

      balanceMessage.textContent =
        message;

      balanceMessage.className =
        "message";

    }


    /* =========================================================
       FORMAT MONEY
       ========================================================= */

    function formatMoney(amount) {

      amount =
        Number(amount || 0);

      return "₹" +
        amount.toLocaleString("en-IN", {
          maximumFractionDigits: 2
        });

    }


    /* =========================================================
       FIREBASE ERROR MESSAGE
       ========================================================= */

    function getFirebaseError(error) {

      if (!error) {
        return "Unknown error";
      }

      if (error.code === "auth/invalid-api-key") {
        return "Invalid Firebase API key. Firebase config check karo.";
      }

      if (error.code === "auth/invalid-credential") {
        return "Email ya password incorrect hai.";
      }

      if (error.code === "auth/wrong-password") {
        return "Password incorrect hai.";
      }

      if (error.code === "auth/user-not-found") {
        return "Admin account Firebase Authentication me nahi mila.";
      }

      if (error.code === "auth/invalid-email") {
        return "Invalid email address.";
      }

      if (error.code === "auth/too-many-requests") {
        return "Bahut attempts ho gaye. Thodi der baad try karo.";
      }

      if (error.code === "permission-denied") {
        return "Firestore permission denied. Firestore Rules check karo.";
      }

      return error.message || "Unknown Firebase error.";

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    logoutBtn.addEventListener("click", async function () {

      try {

        await auth.signOut();

        currentDocRef = null;
        currentUserData = null;

        userBox.classList.add("hidden");

        searchUserId.value = "";
        balanceAmount.value = "";

        balanceMessage.textContent = "";

      } catch (error) {

        console.error(error);

      }

    });

  </script>

</body>
</html>
